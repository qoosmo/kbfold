name: Zero-Knowledge KBFold Manuscript
on:
  push:
    branches: [main]
    paths:
      - "paper/zk-extension/**"
      - ".github/workflows/zk-extension-paper.yml"
  pull_request:
    paths:
      - "paper/zk-extension/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chapters 4–14 Rust algebra audits
        run: |
          cd paper/zk-extension
          sh audit/RUN.sh
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/zk-extension
      - name: Publish consolidated fifteen-chapter PDF on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -s paper/zk-extension/main.pdf
          cp paper/zk-extension/main.pdf paper/zk-extension/KBFold_ZK_Chapters_1-15.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/zk-extension/KBFold_ZK_Chapters_1-15.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish consolidated KBFold ZK chapters 1-15 PDF [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kbfold-zk-manuscript
          path: paper/zk-extension/main.pdf
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: kbfold-zk-source
          path: |
            paper/zk-extension/main.tex
            paper/zk-extension/references.bib
            paper/zk-extension/sections/
            paper/zk-extension/README.md
            paper/zk-extension/THEOREM_LEDGER.md
            paper/zk-extension/CHAPTER_03_LEAN_MAP.md
            paper/zk-extension/CHAPTER_04_LEAN_MAP.md
            paper/zk-extension/CHAPTER_05_LEAN_MAP.md
            paper/zk-extension/CHAPTER_06_LEAN_MAP.md
            paper/zk-extension/CHAPTER_07_LEAN_MAP.md
            paper/zk-extension/CHAPTER_08_LEAN_MAP.md
            paper/zk-extension/CHAPTER_09_LEAN_MAP.md
            paper/zk-extension/CHAPTER_10_LEAN_MAP.md
            paper/zk-extension/CHAPTER_11_LEAN_MAP.md
            paper/zk-extension/CHAPTER_12_LEAN_MAP.md
            paper/zk-extension/CHAPTER_13_LEAN_MAP.md
            paper/zk-extension/CHAPTER_14_LEAN_MAP.md
            paper/zk-extension/ROADMAP_LOCK.md
            paper/zk-extension/audit/
          if-no-files-found: error
