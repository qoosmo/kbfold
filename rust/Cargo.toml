[package]
name = "kbfold"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Abdelali Mkhida <ali.mkhida@algorizk.xyz>"]
description = "KBFold: post-quantum multilinear polynomial commitments from FRI folding in the Boolean-kernel basis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qoosmo/kbfold"
documentation = "https://docs.rs/kbfold"
readme = "README.md"
keywords = ["commitment", "fri", "post-quantum", "multilinear", "basefold"]
categories = ["cryptography", "mathematics"]
exclude = ["target/", "results/"]

[profile.release]
codegen-units = 1
lto = "fat"

[dependencies]
blake3 = "1.8.7"
getrandom = "0.4"
rayon = { version = "1.10", optional = true }

[features]
# Multithreaded prover (transforms, NTT, Merkle trees, folding, sumcheck) with rayon. The proofs
# are identical with and without it.
parallel = ["dep:rayon"]
# Seeded provers (module `insecure`) for test vectors and reproducible digests. Insecure: never
# enable in production.
insecure-test-vectors = []

[dev-dependencies]
blake3 = "1.8.7"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
